CONFIG_MCUX_PRJSEG_module.board.lvgl=y
CONFIG_LV_CONF_SKIP=n
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
CONFIG_LV_OS_FREERTOS=y
CONFIG_LV_USE_OBSERVER=y
CONFIG_FREERTOS_USE_CUSTOM_CONFIG_FRAGMENT=y
CONFIG_LV_VG_LITE_USE_ASSERT=n
CONFIG_LV_USE_ASSERT_NULL=n
CONFIG_LV_USE_ASSERT_MALLOC=n

# --- Performance optimizations ---
# Disable the on-screen FPS/perf monitor. It adds a per-frame label redraw
# plus idle-task sampling (SYSMON) that steals cycles from animations.
CONFIG_LV_USE_PERF_MONITOR=n
# SYSMON is only needed by the perf/mem monitor; drop it to remove the
# idle-task hook overhead.
CONFIG_LV_USE_SYSMON=n
# Disable the logging subsystem. Even at ERROR level, LV_USE_LOG with
# timestamps, file/line info and the many LOG_TRACE_* hooks inserts calls
# on hot paths (refresh, anim, cache, event) each frame.
CONFIG_LV_USE_LOG=n

# Refresh period: default is 33 ms (~30 FPS). The RK055MHD091 panel and the
# VG-Lite GPU can sustain a faster cadence, so shorten the period to 16 ms
# (~60 FPS). This makes animation/roller motion visibly smoother since LVGL
# recalculates and flushes twice as often.
# CONFIG_LV_DEF_REFR_PERIOD=16

# Software draw units: default 1 means the SW-draw fallback (used whenever a
# primitive is not handled by VG-Lite) runs single-threaded. Bump to 2 so
# draw tasks can run in parallel on the extra draw thread and overlap with
# GPU work, reducing per-frame stalls.
CONFIG_LV_DRAW_SW_DRAW_UNIT_CNT=2


CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_IMAGEBUTTON=y
CONFIG_LV_USE_ANIMIMG=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_THEME_DEFAULT=y

CONFIG_LV_USE_FONT_COMPRESSED=y
CONFIG_LV_FONT_FMT_TXT_LARGE=y

CONFIG_MCUX_PRJSEG_config.arm.suppress.warn_as_error=y

